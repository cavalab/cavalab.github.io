yuting:
  name: Yuting Yang, PhD
  avatar: "assets/images/yuting-yang.png"
  bio: "Postdoctoral Fellow"
  home: "members/Yang-Yuting"
  links:
    - label: Website
      icon: &personal "fas fa-user"
      url: "https://yang-yuting.github.io/"
    - label: Google Scholar
      icon: *scholar 
      url: "https://scholar.google.com/citations?user=8DHqW_wAAAAJ"
  about: | 
    Yuting Yang is a postdoctoral research fellow working with [Timothy Miller](https://tmills.github.io/) and William La Cava.
    Yuting develops multimodal foundation models for cardiology medical records. 
    Her current research focuses on multi-modal foundation models for cardiology medical records.
    Yuting is also affiliated with the [Congenital Heart Artificial Intelligence Lab](https://research.childrenshospital.org/research-units/congenital-heart-artificial-intelligence-lab), collaborating with Joshua Mayourian to develop AI tools for pediatric and congenital heart care.

    Yuting received a PhD from the University of Chinese Academy of Sciences, supervised by Jintao Li and Juan Cao. 
    Her doctoral research focused on robust AI, with additional experience in dialogue systems from a research visit at the National University of Singapore with Tat-Seng Chua.

