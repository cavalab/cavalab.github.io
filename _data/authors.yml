neha:
  name: "Neha Dantuluri, BS BS"
  avatar: "assets/images/dantuluri-neha.png"
  bio: "MMSc-BMI Candidate"
  home: "members/Dantuluri-Neha"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:neha_dantuluri@hms.harvard.edu"
    - label: "Github"
      icon: &github "fab fa-fw fa-github"
      url: "https://github.com/ndantuluri429"
    - label: "LinkedIn"
      icon: &linkedin "fab fa-linkedin" 
      url: "https://www.linkedin.com/in/nehadantuluri/"
  about: |
    Neha is an MMSc candidate in Biomedical Informatics at Harvard Medical School. Her research focuses on using computational tools to improve maternal-fetal health outcomes. She graduated from the University of South Florida in 2024 with a B.S. in Biomedical Sciences and a B.S. in Information Sciences. After completing her graduate studies in Biomedical Informatics, she plans to attend medical school. Currently, Neha is working on an AI project involving electronic fetal monitoring, aiming to apply machine learning techniques for equitable and effective clinical deployment.

bill:
  name: "William La Cava, PhD"
  avatar: "assets/images/lacava_profile.JPG"
  bio: "Director"
  home: "members/01_LaCava-William/"
  about: |
      William La Cava is an Assistant Professor at Harvard Medical School and a core faculty member of the Computational Health Informatics Program [(CHIP)](chip.org) at Boston Children's Hospital. 
      Prior to joining CHIP, he was a post-doctoral fellow and research associate in the [Institute for Biomedical Informatics](https://ibi.med.upenn.edu/) at the University of Pennsylvania. 
      He received his PhD from UMass Amherst with a focus on interpretable modelling of dynamical systems. 
