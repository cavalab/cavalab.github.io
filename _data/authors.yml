    Blanca Romero Milà is a PhD Intern in the CHIP Summer Internship in Computational Health Informatics and AI. This summer, she is investigating how implicit bias may influence emergency department admissions and Emergency Severity Index triage scores. Blanca is also a PhD candidate in Biomedical Engineering at the University of California, Irvine. She holds a Bachelor's degree in Biomedical Engineering from the University of Barcelona and a Master's Degree from UC Irvine. 

Ava:
  name: "Ava Fascetti, MS"
  avatar: "assets/images/fascetti-ava.jpg"
  bio: "PhD Intern"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:afascetti@ucsd.edu"
    - label: Google Scholar
      icon: &scholar "fas fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=1ao8frwAAAAJ&hl=en"
    - label: LinkedIn
      icon: &linkedin "fab fa-linkedin" 
      url: "https://www.linkedin.com/in/avafascetti/"
    - label: Github
      icon: &github "fab fa-fw fa-github"
      url: "https://github.com/afascetti"
  about: |
    Ava Fascetti is a PhD student in Electrical and Computer Engineering at UC San Diego, where she is also affiliated with the Design Lab. She received her MS in Electrical and Computer Engineering from UCSD and her BS in General Engineering from Harvey Mudd College. Her research spans engineering, medicine, and design, with a focus on developing accessible health-monitoring tools (including machine-learning biomarkers and low-cost sensing systems) to close gaps in who can receive timely, high-quality care. In the CAVA Lab, she is working on predictive modeling for emergency medicine.
