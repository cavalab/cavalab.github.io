guilherme:
  name: Guilherme Aldeia, PhD
  bio: Postdoctoral Fellow
  avatar: "../assets/images/aldeia.jpeg" 
  home: "members/Aldeia-Guilherme"
  links:
    - label: Github
      icon: *github
      url: "https://github.com/gAldeia"
    - label: LinkedIn
      icon: *linkedin
      url: "https://www.linkedin.com/in/guilherme-aldeia-0a8a0b21b/"
  about: | 
    Guilherme earned his PhD in Computer Science in December 2025, focusing on the computational study and algorithmic improvement of symbolic regression methods and benchmarks. He also holds B.S. degrees in Computer Science and Neuroscience, all from the Federal University of ABC in Brazil.

    He is currently a postdoctoral researcher in the Cava Lab, which he joined in February 2026. His current work includes developing methods and applications of symbolic regression and large language models for healthcare, with an emphasis on interpretable decision-making and predictive modeling. He also works on machine learning models using fMRI data and neural network applications for temporal data.

platon:
  name: Platon Lukyanenko, PhD
  bio: Postdoctoral Fellow
  avatar: "../assets/images/lukyanenko_profile.png" 
  home: "members/Lukyanenko-Platon"
  links:
    - label: Github
      icon: *github
      url: "https://github.com/pxl282"
  about: | 
    Platon Lukyanenko is a postdoctoral fellow investigating transformer architectures for interpreting continuous-time signals. 
    He is a member of the [Congenital Heart Artificial Intelligence Lab](https://research.childrenshospital.org/research-units/congenital-heart-artificial-intelligence-lab) run by Joshua Mayourian in the Department of Cardiology at Boston Children's Hospital.
    Before joining CHIP, he worked on computer vision with the Air Force Research Laboratory. 
    His PhD focused on human motor control decoding for prosthetic hands at Case Western Reserve University. 
    He holds B.S. degrees in Mathematics and Electrical Engineering from the University of Maryland, College Park.

lorenzo:
  name: "Lorenzo Peracchio, MS"
  avatar: "assets/images/Peracchio_Lorenzo.png"
  bio: "PhD Student"
  home: "members/Peracchio-Lorenzo"
  about: |
      Lorenzo Peracchio is a PhD student in Bioengineering, Bioinformatics, and Health Technologies at the University of Pavia, Italy, where he also obtained his Bachelor's and Master's degrees in Bioengineering. 
      His research focuses on the development of methods for evaluating, ensuring, and maintaining the trustworthiness of AI systems, in alignment with the requirements outlined by the EU AI Act and other regulatory bodies. 
