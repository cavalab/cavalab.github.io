<!-- Dark theme: follow the visitor's saved choice, else their system/browser setting.
     Swaps in main-dark.css before first paint. -->
<script>
  (function () {
    var theme;
    try { theme = localStorage.getItem('theme'); } catch (e) {}
    if (theme !== 'dark' && theme !== 'light') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    if (theme !== 'dark') return;
    document.documentElement.setAttribute('data-theme', 'dark');
    var link = document.querySelector('link[rel="stylesheet"][href$="/assets/css/main.css"]');
    if (link) link.href = link.href.replace(/main\.css$/, 'main-dark.css');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = '#1e222a';
  })();
</script>
